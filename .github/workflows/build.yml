
name: Build Fabric Mod

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Mod
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: StealthSetHome
          path: build/libs/*.jar
